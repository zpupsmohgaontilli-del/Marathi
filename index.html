<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>शब्दखेळ - MCQ सराव चाचणी</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text: #1f2937;
      --correct: #16a34a;
      --wrong: #dc2626;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .container {
      max-width: 650px;
      margin: 2rem auto;
      padding: 0 1rem;
      flex: 1;
      width: 100%;
    }

    .header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .header h1 {
      font-size: 2.2rem;
      color: var(--primary);
      margin-bottom: 0.3rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      border: 1px solid var(--border);
    }

    .progress-text {
      font-size: 0.9rem;
      font-weight: 600;
      color: #6b7280;
      margin-bottom: 0.8rem;
    }

    .question-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 1.2rem;
      line-height: 1.4;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      padding: 0.85rem 1rem;
      background: #f9fafb;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background-color: #eef2ff;
    }

    .option-btn.correct {
      background-color: #dcfce7 !important;
      border-color: var(--correct) !important;
      color: #14532d;
      font-weight: 600;
    }

    .option-btn.wrong {
      background-color: #fee2e2 !important;
      border-color: var(--wrong) !important;
      color: #7f1d1d;
      font-weight: 600;
    }

    .nav-buttons {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
    }

    .btn {
      padding: 0.65rem 1.25rem;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--primary);
      color: white;
      transition: background 0.2s ease;
    }

    .btn:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn:disabled {
      background: #d1d5db;
      cursor: not-allowed;
    }

    .loading-spinner {
      text-align: center;
      padding: 2rem;
      color: #6b7280;
    }

    footer {
      background: #ffffff;
      border-top: 1px solid var(--border);
      padding: 1.25rem 1rem;
      text-align: center;
      font-size: 0.9rem;
      color: #4b5563;
      margin-top: auto;
    }

    .visitor-count {
      margin-bottom: 0.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.4rem;
    }

    .credit {
      font-weight: 500;
      color: #1f2937;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>शब्दखेळ</h1>
      <p>MCQ सराव चाचणी</p>
    </div>

    <div class="card" id="quiz-card">
      <div id="loading" class="loading-spinner">प्रश्न लोड होत आहेत, कृपया प्रतीक्षा करा...</div>
      
      <div id="quiz-content" style="display: none;">
        <div class="progress-text" id="progress-indicator">प्रश्न १ / १०</div>
        <div class="question-title" id="question-text">प्रश्न येथे दिसेल</div>
        
        <div class="options" id="options-container">
          <!-- Options rendered via JS -->
        </div>

        <div class="nav-buttons">
          <button class="btn" id="prev-btn" onclick="prevQuestion()">मागील प्रश्न</button>
          <button class="btn" id="next-btn" onclick="nextQuestion()">पुढील प्रश्न</button>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <div class="visitor-count">
      <span>एकूण भेट देणारे (All-time Visitors):</span>
      <img src="https://hitwebcounter.com/counter/counter.php?page=shabdakhel-quiz-unique&style=0006&nbdigits=5&type=page&initCount=0" title="Total Visitors" Alt="Visitor Count" border="0" />
    </div>
    <div class="credit">
      &copy; Vrushabh H. Borkar, Graduate Teacher, ZP Upper Primary School, Mohgaon Tilli
    </div>
  </footer>

  <script>
    // -------------------------------------------------------------
    // REPLACE WITH YOUR PUBLISHED GOOGLE SHEET CSV LINK:
    // File -> Share -> Publish to web -> Link -> CSV -> Publish
    // -------------------------------------------------------------
    const GOOGLE_SHEET_CSV_URL = "YOUR_GOOGLE_SHEET_CSV_URL_HERE";

    let questions = [];
    let currentIndex = 0;
    let userAnswers = {}; // Keeps track of chosen answers per question index

    // Helper: Parse CSV accurately (handling quotes and commas)
    function parseCSV(text) {
      const rows = [];
      let row = [];
      let currentField = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (inQuotes && nextChar === '"') {
            currentField += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          row.push(currentField.trim());
          currentField = '';
        } else if ((char === '\r' || char === '\n') && !inQuotes) {
          if (char === '\r' && nextChar === '\n') i++;
          row.push(currentField.trim());
          if (row.length > 1 || row[0] !== '') rows.push(row);
          row = [];
          currentField = '';
        } else {
          currentField += char;
        }
      }
      if (currentField || row.length > 0) {
        row.push(currentField.trim());
        if (row.length > 1 || row[0] !== '') rows.push(row);
      }
      return rows;
    }

    async function loadQuestions() {
      try {
        const res = await fetch(GOOGLE_SHEET_CSV_URL);
        const data = await res.text();
        const rows = parseCSV(data);

        // Map rows to question objects (Column A to F)
        // Adjust slice(1) if your sheet has a header row
        const dataRows = rows[0][0].toLowerCase().includes("question") ? rows.slice(1) : rows;

        questions = dataRows.map(r => ({
          question: r[0] || "",
          A: r[1] || "",
          B: r[2] || "",
          C: r[3] || "",
          D: r[4] || "",
          correct: (r[5] || "").trim().toUpperCase()
        })).filter(q => q.question !== "");

        if (questions.length === 0) {
          document.getElementById('loading').innerText = "कोणतेही प्रश्न सापडले नाहीत.";
          return;
        }

        document.getElementById('loading').style.display = 'none';
        document.getElementById('quiz-content').style.display = 'block';
        renderQuestion();
      } catch (err) {
        document.getElementById('loading').innerText = "शीट लोड करताना त्रुटी आली. कृपया URL तपासा.";
        console.error(err);
      }
    }

    function renderQuestion() {
      const q = questions[currentIndex];
      document.getElementById('progress-indicator').innerText = `प्रश्न ${currentIndex + 1} / ${questions.length}`;
      document.getElementById('question-text').innerText = q.question;

      const container = document.getElementById('options-container');
      container.innerHTML = '';

      const keys = ['A', 'B', 'C', 'D'];
      const selected = userAnswers[currentIndex];

      keys.forEach(key => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = `${key}) ${q[key]}`;

        if (selected) {
          btn.disabled = true;
          if (key === q.correct) {
            btn.classList.add('correct');
          } else if (key === selected) {
            btn.classList.add('wrong');
          }
        } else {
          btn.onclick = () => selectOption(key);
        }

        container.appendChild(btn);
      });

      document.getElementById('prev-btn').disabled = (currentIndex === 0);
      document.getElementById('next-btn').disabled = (currentIndex === questions.length - 1);
    }

    function selectOption(selectedKey) {
      userAnswers[currentIndex] = selectedKey;
      renderQuestion();
    }

    function prevQuestion() {
      if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
      }
    }

    function nextQuestion() {
      if (currentIndex < questions.length - 1) {
        currentIndex++;
        renderQuestion();
      }
    }

    // Initialize on page load
    loadQuestions();
  </script>
</body>
</html>
